<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini-JAMMS</title>
    <!-- Poppins, the heading font, from Google Fonts. Only weight 600
         (semi-bold) is loaded because that is the only one used.
         "preconnect" opens the connection early so the font arrives sooner.
         display=swap shows the text straight away in the system font and
         swaps Poppins in when it has loaded. Body text does not use it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
